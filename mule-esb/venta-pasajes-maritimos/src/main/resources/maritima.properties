# Configuración de MaritimaSOA (Guía 10: las URL y la cola no van escritas dentro del flujo)

# Puerto donde Mule recibe las ventas: POST http://localhost:8081/api/ventas
http.puerto=8081

# Servicio REST NavieraReservasAPI (viajes, cupos y boletos)
rest.host=localhost
rest.puerto=8082
rest.basePath=/api

# Servicio SOAP AutoridadPortuariaService (puerto y migraciones)
# El contrato (src/main/resources/wsdl/autoridadPortuaria.wsdl) es una copia de
# http://localhost:8083/ws/autoridadPortuaria.wsdl; aquí solo va la dirección del servicio
soap.address=http://localhost:8083/ws

# Apache ActiveMQ
ip.queue=localhost
puerto.queue=61616
usuario.queue=admin
clave.queue=admin
nombre.queue=cola.embarque.boletos
